<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾을 수 없어요 · AI Python Lab</title>
<link rel="stylesheet" href="/aipy2/assets/style.css">
<style>
 .lost{max-width:640px;margin:60px auto;padding:32px;background:#fff;border:1px solid #dce3ed;border-radius:14px}
 .lost h1{font-size:28px;margin-bottom:12px}.lost p{color:#586780;line-height:1.9}
 .lost .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
 .lost code{background:#f0f4f9;padding:2px 6px;border-radius:5px;font-size:13px}
</style></head><body>
<main class="lost" id="main">
 <h1>페이지를 찾을 수 없어요</h1>
 <p id="msg">주소가 바뀐 페이지일 수 있어요. 올바른 위치로 옮겨 드릴게요…</p>
 <div class="actions">
  <a class="button primary" id="go" href="/aipy2/">홈으로</a>
  <a class="button" href="/aipy2/units/unit01/index.html">1단원</a>
  <a class="button" href="/aipy2/units/unit02/index.html">2단원</a>
  <a class="button" href="/aipy2/units/unit03/index.html">3단원</a>
  <a class="button" href="/aipy2/units/unit04/index.html">4단원</a>
 </div>
 <p class="small">계속 이 화면이 보이면 <b>Ctrl+Shift+R</b>(맥은 <b>Cmd+Shift+R</b>)로 새로고침하세요.</p>
</main>
<script>
(function(){
 // 중요: 자동 이동은 한 번만 한다. 캐시된 옛 스크립트가 다시 잘못된 주소로 보내면
 // 404 → 이동 → 404 … 순환이 생기기 때문이다(2026-09-23 수업 중 발생).
 var ONCE = 'aipy-404-redirected';
 // 도착한 페이지에서 따라가기가 다시 잘못된 주소로 보내지 않도록 상태를 끈다.
 try {
  sessionStorage.removeItem('aipy-follow-pending');
  for (var i = sessionStorage.length - 1; i >= 0; i--) {
   var k = sessionStorage.key(i);
   // readFollowing(follow-model.js)은 '0'만 "꺼짐"으로 인식한다. 빈 문자열은 무엇과도 매치되지 않아
   // 기본값(true, 따라가는 중)으로 되돌아가 버린다 — 그러면 이 404 방지 조치가 무효가 된다.
   if (k && k.indexOf('aipy-following:') === 0) sessionStorage.setItem(k, '0');
  }
 } catch (e) {}
 var p = location.pathname.replace(/^\/aipy2/, '');
 var m = /^\/units\/unit0([1-4])\/([a-z0-9-]+)\.html$/.exec(p);
 var target = null;
 if (m) {
  var unit = m[1], name = m[2];
  target = /^u[1-4]-q\d+$/.test(name)
   ? '/aipy2/units/unit0' + unit + '/practice.html#' + name
   : '/aipy2/units/unit0' + unit + '/index.html';
  // 캐시된 옛 HTML 대신 새 HTML을 받도록 한 번만 쿼리를 붙인다.
  target += (target.indexOf('#') < 0 ? '?r=1' : '');
 }
 var go = document.getElementById('go');
 var msg = document.getElementById('msg');
 var already = false;
 try { already = sessionStorage.getItem(ONCE) === '1'; } catch (e) {}
 if (target && !already) {
  try { sessionStorage.setItem(ONCE, '1'); } catch (e) {}
  msg.textContent = '주소가 바뀌었어요. 올바른 위치로 한 번 옮겨 갑니다…';
  go.href = target; go.textContent = '지금 이동하기';
  setTimeout(function(){ location.replace(target); }, 1200);
 } else {
  msg.innerHTML = '선생님 화면 따라가기를 잠시 껐어요. 아래에서 단원을 고르면 이어서 학습할 수 있어요.<br>' +
   '계속 이 화면이 보이면 <b>Ctrl+Shift+R</b>(맥 <b>Cmd+Shift+R</b>)로 새로고침하세요.';
  if (target) { go.href = target; go.textContent = '이 페이지로 이동'; }
 }
 var box = document.createElement('p');
 box.className = 'small';
 box.style.cssText = 'margin-top:18px;padding:10px 12px;background:#f0f4f9;border-radius:8px;word-break:break-all';
 box.innerHTML = '없는 주소: <code>' + location.pathname + (location.hash || '') + '</code>';
 document.getElementById('main').appendChild(box);
})();
</script></body></html>
