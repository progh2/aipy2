name: Build and verify
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static learning pages
        run: python3 tools/web/build.py
      - name: Install Python validation dependencies
        run: python3 -m pip install numpy pandas scikit-learn matplotlib pillow
      - name: Validate examples, questions, links and archives
        run: python3 tools/web/verify.py
  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static learning pages
        run: python3 tools/web/build.py
      - name: Install Playwright with Chromium
        run: |
          npm init -y >/dev/null
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Serve pages and run browser regression test
        run: |
          python3 -m http.server 8767 --directory web >/dev/null 2>&1 &
          sleep 2
          node tools/web/test_classroom_ui.mjs
