name: Build and deploy Python classroom
on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static learning pages
        run: python3 tools/web/build.py
      - name: Install Python validation dependencies
        run: python3 -m pip install numpy pandas scikit-learn matplotlib pillow
      - name: Validate examples, questions, links and archives
        run: python3 tools/web/verify.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
